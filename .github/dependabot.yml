version: 2
# Versão nova só depois de 7 dias publicada; correção de segurança não espera.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    # A 0.26 derruba o processo em análises seguidas (docs/adr/0004-tree-sitter-0-25.md).
    ignore:
      - dependency-name: "tree-sitter"
        versions: [">=0.26"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
