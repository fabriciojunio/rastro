version: 2
# Versão nova só depois de 7 dias publicada; correção de segurança não espera.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    # A 0.26 derruba o processo em análises seguidas (docs/adr/0004-tree-sitter-0-25.md).
    ignore:
      - dependency-name: "tree-sitter"
        versions: [">=0.26"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
