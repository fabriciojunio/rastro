name: Custo em repositório real

# Pergunta 4: quanto custa rodar o rastro numa base de código inteira. Mede tempo
# e memória do rastro variantes no php-src (C) e no spring-framework (Java), nos
# commits dos casos reais. Também é um teste de regressão em código de verdade:
# reprova se o rastro deixar de achar o que achava.
#
# Os repositórios vêm por git fetch do commit exato: o próprio git confere o
# conteúdo pelo hash do commit. As sementes vêm do rastro caso, com SHA-256.
on:
  pull_request:
    branches: ["produção"]
    paths:
      - "src/**"
      - "requisitos/**"
      - ".github/workflows/custo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custo:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: php-src
            caso: php
            repositorio: https://github.com/php/php-src
            commit: 4b15f5d4ec750b31ec8911f5eb0915a45f96feca
            linguagem: c
            funcao: main
            vulneravel: php_php-src_f5936cceeb26_cgi_main.c
            corrigido: php_php-src_0556103f6a34_cgi_main.c
          - nome: spring-framework
            caso: spring
            repositorio: https://github.com/spring-projects/spring-framework
            commit: 1627f57f1f77abe17dd607c75476b9e4cb22ffbb
            linguagem: java
            funcao: CachedIntrospectionResults
            vulneravel: spring-projects_spring-framework_dea5918d66aa_CachedIntrospectionResults.java
            corrigido: spring-projects_spring-framework_3a5af35d37c7_CachedIntrospectionResults.java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Instalar as dependências travadas
        run: python -m pip install --require-hashes --no-deps -r requisitos/base.txt

      - name: Baixar as sementes conferidas
        env:
          PYTHONPATH: src
        run: python -m rastro caso "${{ matrix.caso }}"

      - name: Buscar o repositório no commit do caso
        run: |
          git init -q alvo
          git -C alvo fetch -q --depth 1 "${{ matrix.repositorio }}" "${{ matrix.commit }}"
          git -C alvo checkout -q FETCH_HEAD
          test "$(git -C alvo rev-parse HEAD)" = "${{ matrix.commit }}"

      - name: Rodar e medir
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          /usr/bin/time -v -o tempo.txt python -m rastro variantes \
            --id "${{ matrix.caso }}" --linguagem "${{ matrix.linguagem }}" \
            --vulneravel "dados/casos/${{ matrix.vulneravel }}" \
            --corrigido "dados/casos/${{ matrix.corrigido }}" \
            --funcao "${{ matrix.funcao }}" --alvo alvo --top 20 --json > saida.json
          grep -E "Elapsed|Maximum resident" tempo.txt

      - name: Conferir o que precisa ser achado
        run: |
          python - <<'EOF'
          import json, sys
          saida = json.load(open("saida.json", encoding="utf-8"))
          topo = [(c["arquivo"].replace("\\", "/"), c["funcao"]) for c in saida["candidatos"]]
          contornos = [(c["arquivo"].replace("\\", "/"), c["funcao"]) for c in saida["contornos"]]
          caso = "${{ matrix.caso }}"
          if caso == "php":
              esperado = ("sapi/cgi/cgi_main.c", "main")
              achou = esperado in contornos
          else:
              esperado = ("spring-beans/src/main/java/org/springframework/beans/CachedIntrospectionResults.java", "introspectInterfaces")
              achou = esperado in topo
          print(f"{saida['funcoes_analisadas']} funções; esperado {esperado}: {'achado' if achou else 'NÃO achado'}")
          sys.exit(0 if achou else 1)
          EOF

      - name: Resumo na página da execução
        if: always()
        run: |
          {
            echo "## ${{ matrix.nome }} no commit ${{ matrix.commit }}"
            python -c "import json; print('Funções analisadas:', json.load(open('saida.json'))['funcoes_analisadas'])" || true
            grep -E "Elapsed|Maximum resident" tempo.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: custo-${{ matrix.nome }}
          path: |
            saida.json
            tempo.txt
          retention-days: 90
