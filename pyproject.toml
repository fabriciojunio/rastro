[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "rastro"
version = "0.1.0"
description = "Análise de variantes de vulnerabilidades com aprendizado de máquina"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fabrício Júnio" }]
dependencies = [
    "numpy>=2.4,<3",
    "scikit-learn>=1.9,<2",
    "scipy>=1.17,<2",
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-php>=0.25,<0.26",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[project.scripts]
rastro = "rastro.interfaces.cli:principal"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --cov=rastro --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["rastro"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "tree_sitter_c", "tree_sitter_java", "tree_sitter_php"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "PL"]
ignore = ["S101", "PLR2004", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "S311"]
# Sorteio de experimento, com semente fixa para ser reprodutível; não é criptografia.
"src/rastro/avaliacao/**" = ["S311"]
